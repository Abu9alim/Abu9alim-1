name: Build NextStop APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files from the repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare the app project
        run: |
          mkdir -p app/www
          cd app
          cat > package.json <<'EOF'
          {
            "name": "nextstop",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/clipboard": "^6.0.0",
              "@capacitor/local-notifications": "^6.1.0",
              "@capacitor-community/background-geolocation": "^1.2.20"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.abu9alim.nextstop",
            "appName": "NextStop",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          cp ../delivery-final.html www/index.html
          cp ../manifest.json www/manifest.json || true
          cp ../sw.js www/sw.js || true
          cp ../icon-192.png www/ || true
          cp ../icon-512.png www/ || true
          cat > www/native.js <<'EOF'
          /* NextStop - native Android layer. Runs only inside the Android app, never in the browser. */
          (function(){
          var C=window.Capacitor;
          if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
          var BG=C.registerPlugin("BackgroundGeolocation");
          var LN=C.registerPlugin("LocalNotifications");
          var bgId=null;

          /* 1) no browser-notification gate inside the app */
          window.checkGate=function(){var g=document.getElementById("gate");if(g)g.className=""};
          try{window.checkGate()}catch(e){}

          /* 2) background location: keeps running with the screen off or another app open */
          window.startWatch=function(){
           if(bgId!==null)return;
           bgId="pending";
           try{
            BG.addWatcher({
             backgroundTitle:"NextStop",
             backgroundMessage:"\u064a\u062a\u0627\u0628\u0639 \u0645\u0648\u0642\u0639\u0643 \u0644\u062a\u0646\u0628\u064a\u0647 \u0627\u0644\u0648\u0635\u0648\u0644",
             requestPermissions:true,
             stale:false,
             distanceFilter:5
            },function(loc,err){
             if(err){
              if(err.code==="NOT_AUTHORIZED"){try{st(t("permErr"))}catch(e){}try{BG.openSettings()}catch(e){}}
              return;
             }
             if(loc)onPos({coords:{latitude:loc.latitude,longitude:loc.longitude}});
            }).then(function(id){bgId=id}).catch(function(){bgId=null});
           }catch(e){bgId=null}
          };
          window.restartWatch=function(){};
          window.wakeUp=function(){};

          /* 3) arrival notification with Call / WhatsApp / SMS buttons */
          try{LN.requestPermissions()}catch(e){}
          try{LN.createChannel({id:"arrive",name:"Arrival",description:"Arrival alerts",importance:5,visibility:1,vibration:true})}catch(e){}
          try{LN.registerActionTypes({types:[{id:"ARRIVE",actions:[
           {id:"call",title:"\u0627\u062a\u0635\u0627\u0644",foreground:true},
           {id:"wa",title:"\u0648\u0627\u062a\u0633\u0627\u0628",foreground:true},
           {id:"sms",title:"\u0631\u0633\u0627\u0644\u0629",foreground:true}
          ]}]})}catch(e){}
          window.notify=function(title,body,i){
           try{
            LN.schedule({notifications:[{
             id:Math.floor(Date.now()%2000000000),
             title:title,body:body||"",
             channelId:"arrive",
             actionTypeId:"ARRIVE",
             extra:{i:i}
            }]});
           }catch(e){}
          };
          try{
           LN.addListener("localNotificationActionPerformed",function(ev){
            var i=ev&&ev.notification&&ev.notification.extra?ev.notification.extra.i:null;
            var s=(i!=null)?slots[i]:null;
            if(!s)return;
            var p="";try{p=fix(s.phone||"")}catch(e){}
            var a=ev.actionId;
            if(p&&a==="call"){window.location.href="tel:+"+p}
            else if(p&&a==="sms"){window.location.href="sms:+"+p}
            else if(p&&a==="wa"){window.location.href="whatsapp://send?phone="+p}
            else{openFromNotif(i)}
           });
          }catch(e){}

          /* 4) inside the app WhatsApp opens through the system (Android decides which app) */
          window.waIntent=function(){return "whatsapp://send?phone="+shP};

          })();

          EOF
          cat > www/share.js <<'EOF'
          (function(){
          var C=window.Capacitor;
          /* location shared from Google Maps: fill the link once, then the phone from the clipboard */
          window.__nsLast=0;
          window.nsShareSet=function(id,T){
           if(!T||id<=window.__nsLast)return "skip";
           var al=document.getElementById("al"),ap=document.getElementById("ap");
           if(!al||!ap)return "noInputs";
           window.__nsLast=id;
           var m=T.match(/https?:\/\/\S+/);
           al.value=m?m[0]:T.trim();
           try{al.dispatchEvent(new Event("input",{bubbles:true}))}catch(e){}
           try{updCancel()}catch(e){}
           var CB=null;try{CB=C.registerPlugin("Clipboard")}catch(e){}
           var tries=0;
           var phoneOk=function(v){var n=(v||"").replace(/\D/g,"");return n.length>=7&&n.length<=15&&!/https?:|[a-zA-Z]/.test(v)};
           var isOld=function(v){
            try{var fv=fix(v);for(var q=0;q<slots.length;q++){var sx=slots[q];if(sx&&sx.phone&&fix(sx.phone)===fv)return true}}catch(e){}
            return false;
           };
           var delays=[500,1200,2200,3500,5000,7000];
           var next=function(){
            if(tries<delays.length){setTimeout(tryClip,delays[tries]-(tries?delays[tries-1]:0))}
            else{try{ap.focus()}catch(e){}}
           };
           var tryClip=function(){
            tries++;
            if(ap.value.trim()!==""){return}
            var done=function(v){
             v=(v||"").trim();
             if(phoneOk(v)){
              if(isOld(v)){try{ap.focus()}catch(e){}return}
              ap.value=v;
              try{ap.dispatchEvent(new Event("input",{bubbles:true}))}catch(e){}
              try{updCancel()}catch(e){}
              return;
             }
             next();
            };
            var fail=function(){next()};
            try{
             if(CB){CB.read().then(function(r){done(r&&r.value)}).catch(fail)}
             else if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(done).catch(fail)}
             else{next()}
            }catch(e){fail()}
           };
           try{ap.focus()}catch(e){}
           setTimeout(tryClip,delays[0]);
           try{window.scrollTo(0,0)}catch(e){}
           return "ok";
          };
          })();
          EOF
          sed -i 's#</body>#<script>window.addEventListener("error",function(e){window.__nsErr=(window.__nsErr||"")+e.message+"@"+e.filename+":"+e.lineno+"|"})</script><script src="native.js"></script><script src="share.js"></script></body>#' www/index.html
          tail -c 400 www/index.html
          grep -c 'native.js' www/index.html

      - name: Install and create the Android project
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add permissions and app icon
        working-directory: app
        run: |
          python3 - <<'EOF'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = [
            "ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","ACCESS_BACKGROUND_LOCATION",
            "FOREGROUND_SERVICE","FOREGROUND_SERVICE_LOCATION","POST_NOTIFICATIONS",
            "WAKE_LOCK","VIBRATE","INTERNET"
          ]
          add = ""
          for x in perms:
              line = '<uses-permission android:name="android.permission.' + x + '" />'
              if line not in s:
                  add += "    " + line + "\n"
          s = s.replace("<application", add + "    <application", 1)
          share = ("        <intent-filter>\n"
                   "            <action android:name=\"android.intent.action.SEND\" />\n"
                   "            <category android:name=\"android.intent.category.DEFAULT\" />\n"
                   "            <data android:mimeType=\"text/plain\" />\n"
                   "        </intent-filter>\n")
          if "android.intent.action.SEND" not in s:
              s = s.replace("</activity>", share + "    </activity>", 1)
          open(p, "w", encoding="utf-8").write(s)
          EOF
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../icon-512.png $R/mipmap-$d/ic_launcher.png
            cp ../icon-512.png $R/mipmap-$d/ic_launcher_round.png
            rm -f $R/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Add the share receiver
        working-directory: app
        run: |
          D=android/app/src/main/java/com/abu9alim/nextstop
          mkdir -p $D
          cat > $D/MainActivity.java <<'EOF'
          package com.abu9alim.nextstop;

          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private int shareId = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Intent in = getIntent();
                  boolean fromHistory = in != null && (in.getFlags() & Intent.FLAG_ACTIVITY_LAUNCHED_FROM_HISTORY) != 0;
                  if (savedInstanceState == null && !fromHistory) {
                      sendShare(in);
                  }
                  setIntent(new Intent(Intent.ACTION_MAIN));
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  sendShare(intent);
                  setIntent(new Intent(Intent.ACTION_MAIN));
              }

              private void sendShare(Intent intent) {
                  if (intent == null) return;
                  if (!Intent.ACTION_SEND.equals(intent.getAction())) return;
                  String t = intent.getStringExtra(Intent.EXTRA_TEXT);
                  if (t == null || t.length() == 0) return;
                  shareId++;
                  final String js = "(window.nsShareSet?window.nsShareSet(" + shareId + "," + JSONObject.quote(t) + "):\"NOFUNC\")";
                  int[] delays = {300, 800, 1500, 2500, 4000, 6000, 9000};
                  for (int d : delays) {
                      new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  getBridge().getWebView().evaluateJavascript(js, null);
                              } catch (Exception e) {}
                          }
                      }, d);
                  }
              }
          }
          EOF
          echo "share receiver written"

      - name: Use the fixed signing key
        env:
          KS: ${{ secrets.NS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "ERROR: secret NS_KEYSTORE_B64 is empty or missing"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/ns.keystore"
          cp "$GITHUB_WORKSPACE/ns.keystore" ~/.android/debug.keystore
          keytool -list -keystore "$GITHUB_WORKSPACE/ns.keystore" -storepass android | grep -i "fingerprint"
          cd app/android/app
          python3 - <<'EOF'
          import os
          p = "build.gradle"
          s = open(p, encoding="utf-8").read()
          ks = os.environ["GITHUB_WORKSPACE"] + "/ns.keystore"
          block = ("    signingConfigs {\n"
                   "        debug {\n"
                   "            storeFile file('" + ks + "')\n"
                   "            storePassword 'android'\n"
                   "            keyAlias 'androiddebugkey'\n"
                   "            keyPassword 'android'\n"
                   "        }\n"
                   "    }\n")
          if "signingConfigs" not in s:
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("signing config added:", "signingConfigs" in s)
          EOF

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show the APK signature
        run: |
          keytool -printcert -jarfile app/android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256"
          echo "Expected: DB:89:B7:4D:06:C5:EC:B7:6E:51:29:73:7B:46:5E:19:6B:1D:1D:DA:6D:4F:FE:47:1D:36:95:ED:A5:80:76:10"

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: NextStop-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
